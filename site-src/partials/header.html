<header class="site-header">
  <a class="site-brand" href="/" aria-label="The Echo Archives home">
    <img src="/images/Horizontal-Logo-W.png" alt="The Echo Archives" width="977" height="255" />
  </a>

  <button
    id="siteNavToggle"
    class="site-nav-toggle"
    type="button"
    aria-expanded="false"
    aria-controls="siteNavShell"
    aria-label="Open site navigation"
  >
    <span class="site-nav-toggle-label">Menu</span>
    <span class="site-nav-toggle-icon" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </span>
  </button>

  <div class="site-nav-shell" id="siteNavShell" data-state="closed" aria-hidden="true">
    <button class="site-nav-backdrop" type="button" data-site-nav-close tabindex="-1" aria-label="Close site navigation"></button>
    <div class="site-nav-drawer">
      <div class="site-nav-drawer-head">
        <div>
          <p class="site-nav-kicker">Archive routes</p>
          <p class="site-nav-drawer-copy">Move through the archive without losing the current page.</p>
        </div>
        <button class="site-nav-close" type="button" data-site-nav-close aria-label="Close site navigation">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6 18 18M18 6 6 18" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" />
          </svg>
        </button>
      </div>

      <nav class="site-nav" id="sitePrimaryNav" aria-label="Primary">
        {{navLinks}}
      </nav>

      <div class="header-actions"></div>
    </div>
  </div>
</header>
