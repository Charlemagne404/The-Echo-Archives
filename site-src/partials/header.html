<header class="site-header">
  <a class="site-brand" href="/index.html" aria-label="The Echo Archives home">
    <img src="images/Horizontal-Logo-W.png" alt="The Echo Archives" />
  </a>

  <nav class="site-nav" aria-label="Primary">
    {{navLinks}}
  </nav>

  <div class="header-actions">
    <button class="profile-button" type="button" aria-label="Profile" title="Profile">
      <span class="profile-avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 12a4.25 4.25 0 1 0 0-8.5 4.25 4.25 0 0 0 0 8.5Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"/>
          <path d="M4.75 20.25a7.25 7.25 0 0 1 14.5 0" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"/>
        </svg>
      </span>
    </button>
  </div>
</header>
