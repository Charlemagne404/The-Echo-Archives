<main class="home-main page-main collection-detail-main">
    <section class="hero-shell collection-detail-hero" aria-labelledby="collectionTitle">
      <div class="hero-panel page-panel collection-detail-hero-panel" id="collectionHeroPanel">
        <div class="hero-copy collection-detail-hero-copy">
          <nav class="detail-breadcrumbs" aria-label="Breadcrumb">
            <a href="/">Archive</a>
            <span class="detail-breadcrumb-divider" aria-hidden="true">/</span>
            <a href="/collections">Collections</a>
            <span class="detail-breadcrumb-divider" aria-hidden="true">/</span>
            <span id="collectionBreadcrumbTitle">Collection</span>
          </nav>
          <h1 id="collectionTitle">Collection</h1>
          <p id="collectionDescription">Loading collection...</p>
          <div id="collectionHeroTags" class="collection-detail-tag-row"></div>
          <div class="collections-hero-actions">
            <a id="collectionArchiveHeroLink" class="collection-action collections-primary-action" href="/#archive">Browse in archive</a>
            <a class="collection-secondary-link collections-secondary-action" href="/collections">All collections</a>
            <button id="collectionCopyLink" class="collection-secondary-link collections-secondary-action" type="button">Share</button>
          </div>
          <p class="detail-copy-status collection-copy-status" data-copy-link-status aria-live="polite"></p>
        </div>
        <div id="collectionHeroArt" class="collection-detail-art" aria-hidden="true"></div>
      </div>
    </section>

    <section id="collectionRoot" class="page-card collection-detail-overview" aria-label="Collection at a glance" hidden>
      <div class="collection-detail-overview-row">
        <span class="collection-detail-overview-kicker">At a glance</span>
        <div id="collectionOverviewMetaLine" class="collection-detail-overview-meta-line" aria-label="Collection metadata"></div>
      </div>

      <div id="collectionOverviewChips" class="collection-detail-overview-chips" aria-label="Collection signals"></div>
    </section>

    <section id="collectionArchiveSection" class="archive-section collection-show-section" aria-labelledby="collection-shows-title">
      <div class="section-heading collections-section-heading">
        <div>
          <h2 id="collection-shows-title">Shows in this collection</h2>
          <p id="collectionShowsSummary">Curated entries in this listening path.</p>
        </div>
      </div>

      <div id="collectionShowGrid" class="podcast-card-grid"></div>
    </section>

    <section id="collectionRelatedSection" class="page-card collection-detail-related-section" aria-labelledby="collection-related-title" hidden>
      <div class="section-heading collections-section-heading collection-detail-related-heading">
        <div>
          <span class="page-card-kicker">Keep browsing</span>
          <h2 id="collection-related-title">Related collections</h2>
          <p id="collectionRelatedSummary">Neighboring routes in the archive.</p>
        </div>
      </div>

      <div id="collectionRelatedGrid" class="collections-directory-grid collection-related-grid"></div>
    </section>
  </main>
