<main class="home-main page-main">
    <section class="hero-shell">
      <div class="hero-panel page-panel">
        <div class="hero-copy">
          <h1 id="collectionTitle">Collection</h1>
          <p id="collectionDescription">Loading collection...</p>
        </div>
      </div>
    </section>

    <section id="collectionRoot" class="page-grid">
      <article class="page-card stat-card">
        <span class="page-card-kicker">Shows</span>
        <strong id="collectionShowCount">-</strong>
      </article>
      <article class="page-card stat-card">
        <span class="page-card-kicker">Kind</span>
        <strong id="collectionKind">-</strong>
      </article>
      <article class="page-card stat-card">
        <span class="page-card-kicker">Featured</span>
        <strong id="collectionFeatured">-</strong>
      </article>
      <article class="page-card stat-card">
        <span class="page-card-kicker">Last updated</span>
        <strong id="collectionLastUpdated">-</strong>
      </article>
    </section>

    <section id="collectionArchiveSection" class="archive-section" aria-labelledby="collection-shows-title">
      <div class="section-heading">
        <div>
          <h2 id="collection-shows-title">Shows in this collection</h2>
          <p>Use the archive view if you want the full search and filter controls on top of this route.</p>
        </div>
        <a id="collectionArchiveLink" class="collection-action" href="/index.html#archive">Browse in archive</a>
      </div>

      <div id="collectionShowGrid" class="podcast-card-grid"></div>
    </section>
  </main>
