<main class="home-main page-main submit-main">
    <section class="hero-shell submit-hero-shell">
      <div class="hero-panel page-panel submit-hero-panel">
        <div class="submit-hero-copy">
          <h1>Submit to the archive</h1>
          <p id="submitHeroDescription">
            Choose the right path to help keep the archive accurate, useful, and easy to discover.
          </p>
        </div>
      </div>
    </section>

    <section class="submit-mode-shell submit-surface-card">
      <div class="submit-surface-heading submit-mode-heading">
        <h2>Choose an intake path</h2>
      </div>
      <div id="submitLoadStatus" aria-live="assertive" hidden></div>
      <div id="submitModeCards" class="submit-mode-grid" role="radiogroup" aria-label="Submission type"></div>
    </section>

    <section class="submit-content-shell">
      <div class="submit-content-grid">
        <article class="submit-surface-card submit-form-surface">
          <div id="submitFormIntro" class="submit-surface-heading submit-form-intro" aria-live="polite"></div>
          <form id="showSubmitForm" class="submit-remake-form" novalidate>
            <input type="hidden" id="submissionType" name="submissionType" value="show" />
            <input type="hidden" id="existingShowId" name="existingShowId" value="" />

            <label class="hp-field" aria-hidden="true">
              <span>Website</span>
              <input type="text" name="website" tabindex="-1" autocomplete="off" />
            </label>

            <div id="submitDynamicFields" class="submit-dynamic-fields"></div>

            <div class="submit-form-actions">
              <button type="submit" id="submitPrimaryButton" class="submit-primary-button">
                <span class="submit-primary-button-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m4.75 11.75 13.5-6.25-5 13.5-2.5-4.75-6-2.5Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"/>
                    <path d="M10.75 14.5 18.25 5.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"/>
                  </svg>
                </span>
                <span id="submitPrimaryButtonText">Submit new show</span>
              </button>
              <p id="submitFooterNote" class="submit-footer-note" aria-live="polite"></p>
            </div>
            <p id="submitStatus" class="submit-status" role="status" aria-live="polite" aria-atomic="true"></p>
          </form>
          <section id="submitResultPanel" class="submit-result-panel" hidden></section>
        </article>

        <aside id="submitSideRail" class="submit-side-rail" aria-live="polite"></aside>
      </div>
    </section>
  </main>
