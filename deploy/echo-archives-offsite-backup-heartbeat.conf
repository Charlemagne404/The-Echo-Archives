# Prepared systemd drop-in:
# /etc/systemd/system/echo-archives-offsite-backup.service.d/better-stack-heartbeat.conf
# Install only after /etc/echo-archives/better-stack.env exists with mode 0600.
[Service]
EnvironmentFile=/etc/echo-archives/better-stack.env
ExecStartPost=/usr/bin/node /home/charlie/The-Echo-Archives/deploy/notify-better-stack-heartbeat.js success
ExecStopPost=/usr/bin/node /home/charlie/The-Echo-Archives/deploy/notify-better-stack-heartbeat.js systemd-result
