name: Verify

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Install Playwright Chromium
        run: npx --prefix backend playwright install --with-deps chromium

      - name: Build and verify the complete generated site with required browser smoke
        run: npm run verify

      - name: Confirm clean checkout remains reproducible
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --exit-code
